# Fresko — UAT vhost (uat.phitopolis.io), containerised.
#
# This is the sibling fresko.conf's header refers to. Same shape as the public
# vhost, with four deliberate differences, each of which will break the site if
# reverted:
#
#   1. NO brotli_static. The official nginx image is not built with ngx_brotli;
#      the directive is unknown, `nginx -t` fails, and the container exits
#      immediately at startup. gzip_static IS compiled in and stays.
#   2. proxy_pass targets the compose service name `heimdall`, not 127.0.0.1 —
#      inside a container, loopback is the container itself.
#   3. A resolver + variable proxy_pass, so nginx starts even when Heimdall is
#      still booting. With a literal upstream name, nginx resolves it once at
#      startup and dies with "host not found in upstream" if the API container
#      is not up yet — a startup-order race that looks like a config error.
#   4. Audience is internal reviewers over TLS on a self-signed or internal cert,
#      so HSTS is deliberately omitted: pinning a browser to HTTPS for a hostname
#      whose cert may be replaced during review is a self-inflicted outage.

server {
    listen 80;
    listen [::]:80;
    server_name uat.phitopolis.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name uat.phitopolis.io;

    # Mounted from the host by docker-compose.uat.yml. See UAT.md for both the
    # Let's Encrypt path and the self-signed fallback.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/fresko/dist;
    index index.html;

    gzip_static on;

    client_max_body_size 2m;
    sendfile on;
    tcp_nopush on;

    # Docker's embedded DNS. Required for the variable proxy_pass below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── API: same-origin proxy to Heimdall ──────────────────────────────────────
    # Fresko is built with VITE_API_URL=/, so this block is the ONLY thing making
    # the site show data. If it is missing or ordered after the SPA fallback,
    # /api/v1/services returns 200 with index.html and the client dies inside
    # JSON.parse — the page renders, looks fine, and is simply empty everywhere.
    # nginx matches prefix locations longest-first, so /api/ beats / regardless
    # of file order.
    location /api/ {
        set $heimdall_upstream heimdall;
        proxy_pass         http://$heimdall_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;

        add_header Cache-Control "no-store" always;
    }

    # Heimdall's admin CRUD stays off this vhost even on UAT. Defence in depth:
    # Heimdall gates it too, but a future careless edit to /api/ above must not
    # be the only thing standing between the admin API and an internal reviewer.
    location /api/v1/heimdall/ {
        return 404;
    }

    # ── Static assets ───────────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(images|videos|logos|pdfs)/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { font/woff2 woff2; font/woff woff; font/ttf ttf; }
    }

    # ── SPA fallback ────────────────────────────────────────────────────────────
    # TanStack Router owns the URL space. Without this, every deep link a
    # reviewer pastes or refreshes on returns a hard 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # UAT is pre-release and reviewed internally; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
