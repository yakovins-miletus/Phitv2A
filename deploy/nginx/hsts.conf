# HSTS — production only.
#
# Kept in its own include, separate from security-headers.conf, for one reason:
# the UAT config must NOT send it. UAT runs on a self-signed cert on a
# non-default port, and HSTS is scoped to the host, not the port — pinning a
# browser to HTTPS for uat.phitopolis.io because of a :8443 visit would break
# the :443 site running there. HSTS is also hard to unwind once cached.
#
# Include this in every location block of fresko.conf, alongside
# security-headers.conf. It cannot live at server level: nginx discards
# inherited add_headers in any location that declares one of its own, and every
# location sets Cache-Control — which is exactly the bug that left this config's
# security headers unsent for its entire life.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
