# Security headers, included INSIDE every location block.
#
# ── Why this is an include and not a server-level block ─────────────────────
# nginx's add_header is replace-not-merge across configuration levels: a
# location that declares ANY add_header of its own discards every header
# inherited from the server level. Every location in these configs sets
# Cache-Control, so the server-level security headers were silently dropped
# from every response the site actually served — including index.html, which is
# the one response where X-Frame-Options matters.
#
# Verified against the running stack before the fix:
#
#   $ curl -sI http://127.0.0.1:8081/
#   HTTP/1.1 200 OK
#   Cache-Control: no-cache          <- the only header that survived
#
# Include this file in every location block. Do not "tidy" it back up to the
# server level.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy.
#
# `style-src 'unsafe-inline'` is required: Emotion (MUI's engine) injects styles
# at runtime, and a nonce pipeline would need SSR. That does NOT weaken
# script-src, which is the half that actually stops injected code — and the
# audit found zero HTML-injection sinks in src/ (no dangerouslySetInnerHTML, no
# innerHTML, no eval), so this is defence in depth rather than a patch.
#
# img-src allows https: because blog `image_url` values come from the CMS and
# may point at external hosts. object-src 'none' covers the <object> PDF embed
# in BrochureDrawer. base-uri 'self' is load-bearing — index.html loads its
# module script by relative path, so a injected <base> would repoint it.
# frame-src allows the Google Maps embed on /contact.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
