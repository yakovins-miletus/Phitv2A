# Fresko — public-facing frontend, read-only against Heimdall.
#
# One server block per hostname, so Fresko, the UAT site, and Heimdall's admin UI
# coexist on a single EC2 instance without competing for port 80/443. Nothing here
# binds a port other than 80/443; the app processes bind loopback only.
#
#   fresko.<domain>        this file            static dist/ + /api/ proxy
#   uat.<domain>           fresko-uat.conf      same shape, different root and port
#   Heimdall admin         NOT exposed here     Tailscale only, per Heimdall's README
#
# ── THE ONE THING THAT MUST NOT BE GOT WRONG ────────────────────────────────────
#
# `location /api/` MUST be matched before the SPA fallback. Fresko builds with
# `VITE_API_URL=/`, so every API call is a same-origin request to `/api/v1/...`. If the
# proxy block is missing or ordered after `try_files`, those requests fall through to
# `/index.html` and return **200 with an HTML body** — the client then dies inside
# JSON.parse instead of surfacing a network error. That is strictly harder to diagnose
# than a refused connection, and it is exactly what happens on `vite preview`, which has
# no proxy: `GET /api/v1/services` returns 200 and the page silently shows no data.
#
# nginx matches prefix locations longest-first regardless of file order, so `/api/`
# beats `/`. The ordering below is for humans; do not "tidy" it by deleting the block.

upstream heimdall {
    # Heimdall binds 127.0.0.1:8000 and is never reachable from outside the instance.
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name fresko.example.com;          # ← set to the real hostname
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fresko.example.com;          # ← set to the real hostname

    ssl_certificate     /etc/letsencrypt/live/fresko.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fresko.example.com/privkey.pem;

    # Pin the protocol set. Without these, nginx uses the host default, which on
    # older builds still includes TLSv1/TLSv1.1.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    root /var/www/fresko/dist;
    index index.html;

    # `yarn build` emits a .br and .gz beside every asset (vite-plugin-compression2).
    # Without these two directives that work is on disk and never served.
    brotli_static on;
    gzip_static   on;

    # Reasonable defaults for a marketing site with large media.
    client_max_body_size 2m;
    sendfile on;
    tcp_nopush on;

    # ── API: same-origin proxy to Heimdall ──────────────────────────────────────
    # Read-only public endpoints plus the contact-form POST. Longest-prefix match
    # means this wins over the `/` fallback below — see the note at the top.
    location /api/ {
        proxy_pass         http://heimdall;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;

        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/hsts.conf;
        # Never cache API responses at the edge; Heimdall owns freshness.
        add_header Cache-Control "no-store" always;
    }

    # Heimdall's admin CRUD is Tailscale-only. Deny it explicitly on the PUBLIC
    # server block so a future change to the `/api/` proxy cannot accidentally
    # expose it. This is defence in depth: Heimdall gates it too.
    location /api/v1/heimdall/ {
        return 404;
    }

    # ── Static assets ───────────────────────────────────────────────────────────
    # Content-hashed filenames, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/hsts.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Media is NOT content-hashed: long enough to matter, short enough that
    # replacing a file actually takes effect. Mirrors netlify.toml / vercel.json,
    # neither of which applies on EC2.
    location ~* ^/(images|videos|logos|pdfs)/ {
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/hsts.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Fonts are content-hashed by the build and preloaded from index.html.
    location ~* \.(woff2?|ttf)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/hsts.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { font/woff2 woff2; font/woff woff; font/ttf ttf; }
    }

    # ── SPA fallback ────────────────────────────────────────────────────────────
    # TanStack Router owns the URL space; every unmatched path must serve the shell.
    # The document itself is never cached, or a deploy never reaches anyone.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
        include /etc/nginx/conf.d/hsts.conf;
        add_header Cache-Control "no-cache" always;
    }

    # ── Security headers ────────────────────────────────────────────────────────
    # These used to live here, at server level, and were therefore NEVER SENT:
    # nginx discards inherited add_headers in any location that declares one of
    # its own, and every location above sets Cache-Control. They now live in
    # deploy/nginx/security-headers.conf and are included per-location.
    #
    # HSTS is in its own include (hsts.conf) rather than security-headers.conf,
    # because the UAT config must not send it — self-signed cert, non-default
    # port, and HSTS is scoped to the host rather than the port. It is included
    # per-location above for the same inheritance reason as everything else.
}
