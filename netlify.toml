[build]
  command = "npm run build"
  publish = "dist"

# Content-hashed filenames: safe to cache forever. Without this every chunk is
# revalidated on every visit — the README documented these headers but no host
# config actually set them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media is NOT content-hashed, so it gets a finite lifetime rather than
# `immutable` — long enough to matter, short enough that replacing a file
# actually takes effect.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The entry document must never be cached, or a deploy never reaches anyone.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
